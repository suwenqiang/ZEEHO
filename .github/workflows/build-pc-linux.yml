name: build-pc-linux

on:
  push:
    branches: [ main ]
    paths:
      - "desktop/**"
      - "repo/zeeho_box_enhanced.js"
      - ".github/workflows/build-pc-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pc
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps

      - name: Build (AppImage + deb)
        working-directory: desktop
        run: npm run dist:linux

      - name: List dist
        working-directory: desktop
        run: ls -lh dist

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          tag_name: pc-latest
          name: 极核签到面板桌面版
          body: |
            Windows 与 Ubuntu Linux 桌面版安装包。
            - Windows：Setup 安装版（NSIS，x64）和 Portable 便携版（x64）
            - Linux：AppImage 与 deb 安装包（x64）
            - 内核：构建时打包 repo/zeeho_box_enhanced.js
          files: |
            desktop/dist/ZeehoPanel-Linux-*.AppImage
            desktop/dist/ZeehoPanel-Linux-*.deb
          overwrite: true
          make_latest: true

      - name: Prune old Linux assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "keep version: $VER"
          node - "$VER" <<'EOF'
          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const ver = process.argv[2];
          (async () => {
            const h = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
            const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/pc-latest`, { headers: h });
            if (!response.ok) throw new Error(`release lookup failed: ${response.status}`);
            const rel = await response.json();
            const keep = new Set([`ZeehoPanel-Linux-${ver}.AppImage`, `ZeehoPanel-Linux-${ver}.deb`]);
            for (const asset of rel.assets || []) {
              if (!String(asset.name).startsWith("ZeehoPanel-Linux-") || keep.has(String(asset.name))) continue;
              const result = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, { method: "DELETE", headers: h });
              if (!result.ok) throw new Error(`failed to prune ${asset.name}: ${result.status}`);
              console.log(`pruned ${asset.name}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
